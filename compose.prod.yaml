services:

    laravel:
        build:
            context: .
            dockerfile: Dockerfile.prod
        image: gestionale-app:prod
        restart: unless-stopped

        env_file:
            - .env.production

        networks:
            - app

        depends_on:
            mysql:
                condition: service_healthy
            minio:
                condition: service_started

        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "5"


    nginx:
        image: nginx:1.27-alpine
        restart: unless-stopped

        ports:
            - "80:80"

        volumes:
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
            - ./public:/var/www/html/public:ro

        networks:
            - app

        depends_on:
            - laravel

        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "5"


    mysql:
        image: mysql:8.4
        restart: unless-stopped

        environment:
            MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
            MYSQL_DATABASE: ${DB_DATABASE}
            MYSQL_USER: ${DB_USERNAME}
            MYSQL_PASSWORD: ${DB_PASSWORD}

        volumes:
            - mysql-data:/var/lib/mysql

        networks:
            - app

        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - "-p${DB_ROOT_PASSWORD}"
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 30s

        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "5"


    minio:
        image: minio/minio:latest
        restart: unless-stopped

        env_file:
            - .env.production

        environment:
            MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID}
            MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY}

        volumes:
            - minio-data:/data

        networks:
            - app

        command: server /data --console-address ":9001"

        logging:
            driver: json-file
            options:
                max-size: "10m"
                max-file: "5"


networks:
    app:
        driver: bridge


volumes:
    mysql-data:
        driver: local

    minio-data:
        driver: local